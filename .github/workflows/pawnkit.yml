name: PawnKit

on:
  push:
    branches: [master, feat/pawnkit]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pawnkit/pawn-actions/setup@v1.8.25
        with:
          version: 1.33.0
          download-url: https://github.com/pawnkit/pawnkit-cli/releases/download/v1.33.0/pawn-linux-amd64.tar.gz
          sha256: 01feebf5bf0cb89b752f7a4002b132c8efa1c78c3e9ac26319a16f7e5c074db3

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.25
        with:
          binary: pawnfmt
          version: v1.4.5
          download-url: https://github.com/pawnkit/pawnfmt/releases/download/v1.4.5/pawnfmt_1.4.5_linux_amd64.tar.gz
          sha256: 5b90db32f125fce2ead81164d54ca07934b741847f9f546bd11904d48ea6cceb

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.25
        with:
          binary: pawnlint
          version: v1.8.9
          download-url: https://github.com/pawnkit/pawnlint/releases/download/v1.8.9/pawnlint_1.8.9_linux_amd64.tar.gz
          sha256: 8e9b01f76ec3af2d3c9af43c6733e3137d7b149003636e1b377d326d2f91948d

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pawn install

      - uses: pawnkit/pawn-actions/build@v1.8.25

      - uses: pawnkit/pawn-actions/fmt@v1.8.25

      - uses: pawnkit/pawn-actions/lint@v1.8.25

      - name: Install legacy plugin libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes libuuid1:i386

      - name: Smoke test server startup
        run: |
          set +e
          timeout 90s pawn run > "$RUNNER_TEMP/pawn-run.log" 2>&1
          run_code=$?
          set -e
          cat "$RUNNER_TEMP/pawn-run.log"
          if [ "$run_code" -ne 0 ] && [ "$run_code" -ne 124 ]; then
            exit "$run_code"
          fi
          grep -F "Legacy Network started" "$RUNNER_TEMP/pawn-run.log"
          if grep -F "[Error]" "$RUNNER_TEMP/pawn-run.log"; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-amx
          path: gamemodes/ScavengeSurvive.amx
          if-no-files-found: error
