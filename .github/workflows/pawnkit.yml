name: PawnKit

on:
  push:
    branches: [master, feat/pawnkit]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pawnkit/pawn-actions/setup@v1.8.50
        with:
          version: 1.34.15
          download-url: https://github.com/pawnkit/pawnkit-cli/releases/download/v1.34.15/pawn-linux-amd64.tar.gz
          sha256: d54e187777d05ef00f5252bde995a2c2cde1fd58cb221a7736426f5754ebf8bf

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.50
        with:
          binary: pawnfmt
          version: v1.4.7
          download-url: https://github.com/pawnkit/pawnfmt/releases/download/v1.4.7/pawnfmt_1.4.7_linux_amd64.tar.gz
          sha256: c1543626b076915744c16459c5df0e533446d05c9422f8103ea405e168760eba

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.50
        with:
          binary: pawnlint
          version: v1.8.32
          download-url: https://github.com/pawnkit/pawnlint/releases/download/v1.8.32/pawnlint_1.8.32_linux_amd64.tar.gz
          sha256: ba41065fd420d97660fab4ad8a1197bb47050cd6067aeb7c7ece5d93a1bf0034

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pawn install

      - uses: pawnkit/pawn-actions/build@v1.8.50

      - uses: pawnkit/pawn-actions/fmt@v1.8.50

      - uses: pawnkit/pawn-actions/lint@v1.8.50

      - name: Install legacy plugin libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes libatomic1:i386 libuuid1:i386

      - name: Smoke test server startup
        run: |
          set +e
          timeout 90s pawn run > "$RUNNER_TEMP/pawn-run.log" 2>&1
          run_code=$?
          set -e
          cat "$RUNNER_TEMP/pawn-run.log"
          if [ "$run_code" -ne 0 ] && [ "$run_code" -ne 124 ]; then
            exit "$run_code"
          fi
          grep -F "Legacy Network started" "$RUNNER_TEMP/pawn-run.log"
          if grep -F "[Error]" "$RUNNER_TEMP/pawn-run.log"; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-amx
          path: gamemodes/ScavengeSurvive.amx
          if-no-files-found: error
