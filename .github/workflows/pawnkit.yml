name: PawnKit

on:
  push:
    branches: [master, feat/pawnkit]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pawnkit/pawn-actions/setup@v1.8.72
        with:
          version: 1.34.29
          download-url: https://github.com/pawnkit/pawnkit-cli/releases/download/v1.34.29/pawn-linux-amd64.tar.gz
          sha256: 7de00c510c1beb9de66fb2554ceb5314e41e5fec86a46a2626f65a22c038ce61

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.72
        with:
          binary: pawnfmt
          version: v1.4.10
          download-url: https://github.com/pawnkit/pawnfmt/releases/download/v1.4.10/pawnfmt_1.4.10_linux_amd64.tar.gz
          sha256: 7a1f182fe43f0114ad665a97209e2e3bf332324bd1f380c215ce1a417d34eb48

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.72
        with:
          binary: pawnlint
          version: v1.8.53
          download-url: https://github.com/pawnkit/pawnlint/releases/download/v1.8.53/pawnlint_1.8.53_linux_amd64.tar.gz
          sha256: ccc44069aeb25202a5dd4da3870952468f3dc345b28680f8541a98076f4a53df

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pawn install

      - uses: pawnkit/pawn-actions/build@v1.8.72

      - uses: pawnkit/pawn-actions/fmt@v1.8.72

      - uses: pawnkit/pawn-actions/lint@v1.8.72

      - name: Install legacy plugin libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes libatomic1:i386 libuuid1:i386

      - name: Smoke test server startup
        run: |
          set +e
          timeout 90s pawn run > "$RUNNER_TEMP/pawn-run.log" 2>&1
          run_code=$?
          set -e
          cat "$RUNNER_TEMP/pawn-run.log"
          if [ "$run_code" -ne 0 ] && [ "$run_code" -ne 124 ]; then
            exit "$run_code"
          fi
          grep -F "Legacy Network started" "$RUNNER_TEMP/pawn-run.log"
          if grep -F "[Error]" "$RUNNER_TEMP/pawn-run.log"; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-amx
          path: gamemodes/ScavengeSurvive.amx
          if-no-files-found: error
