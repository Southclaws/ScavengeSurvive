name: PawnKit

on:
  push:
    branches: [master, feat/pawnkit]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pawnkit/pawn-actions/setup@v1.8.51
        with:
          version: 1.34.17
          download-url: https://github.com/pawnkit/pawnkit-cli/releases/download/v1.34.17/pawn-linux-amd64.tar.gz
          sha256: 9afbc4ac88cb4b059f90d22a82fc01080a54e6b62fd726ed4e14705fe52a3f8a

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.51
        with:
          binary: pawnfmt
          version: v1.4.8
          download-url: https://github.com/pawnkit/pawnfmt/releases/download/v1.4.8/pawnfmt_1.4.7_linux_amd64.tar.gz
          sha256: 69f8372a0e33dfbc04d7e64e9b482f087f8e08f0fb45682f209236e281f3f821

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.51
        with:
          binary: pawnlint
          version: v1.8.34
          download-url: https://github.com/pawnkit/pawnlint/releases/download/v1.8.34/pawnlint_1.8.32_linux_amd64.tar.gz
          sha256: 29383113fad209bd81c0a71ae518c9ecbc6022034a41acb954f1449e084a8981

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pawn install

      - uses: pawnkit/pawn-actions/build@v1.8.51

      - uses: pawnkit/pawn-actions/fmt@v1.8.51

      - uses: pawnkit/pawn-actions/lint@v1.8.51

      - name: Install legacy plugin libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes libatomic1:i386 libuuid1:i386

      - name: Smoke test server startup
        run: |
          set +e
          timeout 90s pawn run > "$RUNNER_TEMP/pawn-run.log" 2>&1
          run_code=$?
          set -e
          cat "$RUNNER_TEMP/pawn-run.log"
          if [ "$run_code" -ne 0 ] && [ "$run_code" -ne 124 ]; then
            exit "$run_code"
          fi
          grep -F "Legacy Network started" "$RUNNER_TEMP/pawn-run.log"
          if grep -F "[Error]" "$RUNNER_TEMP/pawn-run.log"; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-amx
          path: gamemodes/ScavengeSurvive.amx
          if-no-files-found: error
