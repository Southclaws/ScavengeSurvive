name: PawnKit

on:
  push:
    branches: [master, feat/pawnkit]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pawnkit/pawn-actions/setup@v1.8.50
        with:
          version: 1.34.0
          download-url: https://github.com/pawnkit/pawnkit-cli/releases/download/v1.34.0/pawn-linux-amd64.tar.gz
          sha256: 08832cb8e2cf2ea9a660cf42df4f2db93be160dd2b955a4c44e234b51451f374

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.50
        with:
          binary: pawnfmt
          version: v1.4.4
          download-url: https://github.com/pawnkit/pawnfmt/releases/download/v1.4.4/pawnfmt_1.4.4_linux_amd64.tar.gz
          sha256: a728fd7a5a56a91371d653f6625630dbbef499b80594187afaa14fd6203cfd40

      - uses: pawnkit/pawn-actions/setup-tool@v1.8.50
        with:
          binary: pawnlint
          version: v1.8.10
          download-url: https://github.com/pawnkit/pawnlint/releases/download/v1.8.10/pawnlint_1.8.10_linux_amd64.tar.gz
          sha256: 7e827e0d83b942e3f305d9584c3aa2ec5021f113bf3bce41413efb6bfad54f49

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pawn install

      - uses: pawnkit/pawn-actions/build@v1.8.50

      - uses: pawnkit/pawn-actions/fmt@v1.8.50

      - uses: pawnkit/pawn-actions/lint@v1.8.50

      - name: Install legacy plugin libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes libatomic1:i386 libuuid1:i386

      - name: Smoke test server startup
        run: |
          set +e
          timeout 90s pawn run > "$RUNNER_TEMP/pawn-run.log" 2>&1
          run_code=$?
          set -e
          cat "$RUNNER_TEMP/pawn-run.log"
          if [ "$run_code" -ne 0 ] && [ "$run_code" -ne 124 ]; then
            exit "$run_code"
          fi
          grep -F "Legacy Network started" "$RUNNER_TEMP/pawn-run.log"
          if grep -F "[Error]" "$RUNNER_TEMP/pawn-run.log"; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-amx
          path: gamemodes/ScavengeSurvive.amx
          if-no-files-found: error
