name: build

on:
  push:
    branches: ["master"]

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: AGraber/sampctl-action@v1
        with:
          version: "1.14.1"
      - run: sampctl build --forceEnsure
        env:
          SAMPCTL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v2
        with:
          name: compiled-amx
          path: gamemodes/ScavengeSurvive.amx
